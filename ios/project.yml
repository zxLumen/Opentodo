name: Opentodo
options:
  bundleIdPrefix: com.opentodo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T8TG4WAR43
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OpentodoCore:
    path: ../shared/swift/OpentodoCore

targets:
  Opentodo:
    type: application
    platform: iOS
    sources:
      - path: Opentodo
    dependencies:
      - package: OpentodoCore
        product: OpentodoCore
    info:
      path: Opentodo/Info.plist
      properties:
        CFBundleDisplayName: Opentodo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 用于语音记录待办
        NSSpeechRecognitionUsageDescription: 用于把你说的话转成待办
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentodo.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OpentodoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpentodoTests
    dependencies:
      - target: Opentodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opentodo.ios.tests
        GENERATE_INFOPLIST_FILE: YES
